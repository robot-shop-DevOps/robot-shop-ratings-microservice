apiVersion: v1

kind: Service

metadata:
  name: {{ .Values.ratings.microservice }}-service

spec:
  type: {{ .Values.ratings.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/Version: {{ .Chart.Version }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: {{ .Values.ratings.microservice }}
    {{- range $key,$value := .Values.ratings.labels }}
    {{ $key }}: {{ $value }}
    {{- end }}
  ports:
  - name: http
    port: {{ .Values.ratings.service.port }}
    targetPort: {{ .Values.ratings.service.targetPort }}