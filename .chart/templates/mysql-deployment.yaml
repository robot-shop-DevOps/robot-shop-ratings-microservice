apiVersion: apps/v1

kind: Deployment

metadata:
  name: {{ .Values.mysql.microservice }}-deployment
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/Version: {{ .Chart.Version }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: {{ .Values.mysql.microservice }}
    {{- range $key,$value := .Values.mysql.labels }}
    {{ $key }}: {{ $value }}
    {{- end }}

spec:
  replicas: {{ .Values.mysql.replicas }}
  strategy: 
{{ .Values.mysql.strategy | toYaml | indent 4 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/Version: {{ .Chart.Version }}
      app.kubernetes.io/managed-by: {{ .Release.Service }}
      app.kubernetes.io/component: {{ .Values.mysql.microservice }}
      {{- range $key,$value := .Values.mysql.labels }}
      {{ $key }}: {{ $value }}
      {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/Version: {{ .Chart.Version }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/component: {{ .Values.mysql.microservice }}
        {{- range $key,$value := .Values.mysql.labels }}
        {{ $key }}: {{ $value }}
        {{- end }}
    spec:
      containers:
      - name: {{ .Values.mysql.microservice }}
        image: "{{ .Values.mysql.container.image.repo }}:{{ .Values.mysql.container.image.version }}"
        imagePullPolicy: {{ .Values.mysql.container.image.imagePullPolicy }}
        ports: 
        - containerPort: {{ .Values.mysql.container.port }}